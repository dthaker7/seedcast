{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Seedcast{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'landing' %}">Seedcast</a>
    <nav aria-label="Main navigation">
      {% if user.is_authenticated %}
        <a href="{% url 'money:dashboard' %}">Home</a>
        <a href="{% url 'money:budget_create' %}">Add snapshot</a>
        <a href="{% url 'money:profile_setup' %}">Profile</a>
        <form method="post" action="{% url 'logout' %}" class="inline-form">
          {% csrf_token %}
          <button class="link-button" type="submit">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Log in</a>
        <a href="{% url 'signup' %}">Get started</a>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
