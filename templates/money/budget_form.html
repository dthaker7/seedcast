{% extends "base.html" %}
{% block title %}Money snapshot | Seedcast{% endblock %}
{% block content %}
<section class="form-card">
  <p class="eyebrow">Money snapshot</p>
  <h1>What happened with your money this month?</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Save snapshot</button>
  </form>
</section>
{% endblock %}
